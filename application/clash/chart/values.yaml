replicas: 1
commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}
revisionHistoryLimit: 10
updateStrategy: {}
imagePullSecrets: []
affinity: {}
podAffinityPreset: ""
podAntiAffinityPreset: "soft"
nodeAffinityPreset:
  type: "none"
  key: ""
  values: []
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  supplementalGroups: []
  fsGroup: 1001
nodeSelector: {}
tolerations: []
extraVolumes: []
image:
  repository: docker.io/metacubex/mihomo
  tag: v1.19.30
  pullPolicy: IfNotPresent

command: []
args: []

subscription:
  existingSecret: ""

config:
  dir: /root/.config/mihomo
  logLevel: info

provider:
  cachePath: providers/subscription.yaml
  interval: 3600
  healthCheck:
    enabled: true
    url: https://www.gstatic.com/generate_204
    interval: 300
ports:
  http: 7890
  controller: 9090
timezone: "Asia/Shanghai"
extraEnvVars: {}
extraEnvVarsSecret: ""
extraVolumeMounts: []
resourcesPreset: "medium"
customLivenessProbe: {}
customReadinessProbe: {}
customStartupProbe: {}
persistence:
  enabled: false
  storageClass: ""
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  subPath: ""
  annotations: {}
  selector: {}
  dataSource: {}
service:
  # Exposing proxy service(7890) via ingress is complex due to:
  # - Ingress Controllers (e.g. Nginx) are designed for regular HTTP services
  # - Proxy requests use absolute URLs in request line
  # - Host header is target server's domain, not ingress domain
  # - Path in proxy requests is unrelated to ingress path configuration
  # default: NodePort is used for simplicity
  type: NodePort
  ports:
    http: 7890
    httpNodePort: 31789
    controller: 9090
    controllerNodePort: 31909
  annotations: {}
  clusterIP: ""
  sessionAffinity: ""
  sessionAffinityConfig: {}
  externalTrafficPolicy: ""
  loadBalancerSourceRanges: []
  loadBalancerIP: ""
  loadBalancerClass: ""
  extraPorts: []
ingress:
  controller:
    enabled: false
    annotations: {}
    ingressClassName: nginx
    hostname: controller.clash.example.com
    path: /
    pathType: Prefix
    tls: false
extraDeploy: []
