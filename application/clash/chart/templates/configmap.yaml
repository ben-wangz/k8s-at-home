{{- $providerCachePath := required "provider.cachePath is required" .Values.provider.cachePath -}}
{{- if or (hasPrefix "/" $providerCachePath) (contains ".." $providerCachePath) }}
{{- fail "provider.cachePath must be relative and must not contain '..'" }}
{{- end }}
{{- if and .Values.console.enabled (not (hasPrefix "/" .Values.console.mountPath)) }}
{{- fail "console.mountPath must be absolute" }}
{{- end }}
{{- if and .Values.console.enabled (or (not (hasPrefix (printf "%s/" (trimSuffix "/" .Values.config.dir)) (trimSuffix "/" .Values.console.mountPath))) (contains ".." .Values.console.mountPath)) }}
{{- fail "console.mountPath must be below config.dir to satisfy Mihomo safe paths" }}
{{- end }}
{{- if and .Values.console.enabled .Values.ingress.controller.enabled (ne .Values.ingress.controller.path "/") }}
{{- fail "Clash Console requires the controller ingress path to be /" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clash.configTemplate.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  config.yaml.template: |
    mixed-port: {{ .Values.ports.http }}
    allow-lan: true
    mode: rule
    log-level: {{ .Values.config.logLevel }}
    external-controller: 0.0.0.0:{{ .Values.ports.controller }}
    {{- if .Values.console.enabled }}
    external-ui: {{ .Values.console.mountPath | quote }}
    {{- end }}
    {{- if .Values.controller.existingSecret }}
    secret: |2-
      __CONTROLLER_SECRET__
    {{- end }}
    external-controller-cors:
      allow-origins: {{ .Values.controller.cors.allowedOrigins | toJson }}
      allow-private-network: {{ .Values.controller.cors.allowPrivateNetwork }}
    profile:
      store-selected: {{ .Values.config.storeSelected }}

    proxy-providers:
      subscription:
        type: http
        url: |-
          __SUBSCRIPTION_URL__
        path: {{ printf "./%s" $providerCachePath | quote }}
        interval: {{ .Values.provider.interval }}
        {{ if .Values.provider.healthCheck.enabled }}
        health-check:
          enable: true
          url: {{ .Values.provider.healthCheck.url | quote }}
          interval: {{ .Values.provider.healthCheck.interval }}
        {{ end }}

    proxy-groups:
      - name: PROXY
        type: select
        use:
          - subscription
        proxies:
          - DIRECT

    rules:
      - MATCH,PROXY
