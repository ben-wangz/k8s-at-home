apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if .Values.updateStrategy }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.podLabels "context" $ ) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.podLabels "context" $ ) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.console.enabled (not .Values.console.existingConfigMap) }}
        checksum/console: {{ include (print $.Template.BasePath "/console.configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{- include "common.tplvalues.render" ( dict "value" .Values.imagePullSecrets "context" $ ) | nindent 6 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.affinity "context" $ ) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" ( dict "type" .Values.podAffinityPreset "customLabels" .Values.podLabels "context" $ ) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" ( dict "type" .Values.podAntiAffinityPreset "customLabels" .Values.podLabels "context" $ ) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" ( dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values ) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.nodeSelector "context" $ ) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" ( dict "value" .Values.tolerations "context" $ ) | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" ( dict "secContext" .Values.podSecurityContext "context" $ ) | nindent 8 }}
      {{- end }}
      initContainers:
      - name: render-config
        image: {{ include "common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /bin/sh
        - -ec
        args:
        - |
          subscription_url="$(cat /input/subscription-url)"
          if [ -z "$subscription_url" ]; then
            echo "subscription URL is empty" >&2
            exit 1
          fi
          if printf '%s' "$subscription_url" | grep -q '[[:space:]]'; then
            echo "subscription URL must be a single line" >&2
            exit 1
          fi
          mkdir -p "$MIHOMO_CONFIG_DIR/$(dirname "$MIHOMO_PROVIDER_PATH")"
          if [ -f /input/controller-secret ]; then
            if ! awk 'END { if (NR != 1 || length($0) == 0) exit 1 }' /input/controller-secret; then
              echo "controller secret must be a nonempty single line" >&2
              exit 1
            fi
          fi
          awk '
            $0 == "      __SUBSCRIPTION_URL__" {
              if ((getline url < "/input/subscription-url") <= 0) {
                exit 1
              }
              print "      " url
              next
            }
            $0 == "  __CONTROLLER_SECRET__" {
              if ((getline secret < "/input/controller-secret") <= 0) {
                exit 1
              }
              print "  " secret
              next
            }
            { print }
          ' /input/config.yaml.template > "$MIHOMO_CONFIG_DIR/config.yaml"
          if grep -qE '__SUBSCRIPTION_URL__|__CONTROLLER_SECRET__' "$MIHOMO_CONFIG_DIR/config.yaml"; then
            echo "failed to render runtime configuration" >&2
            exit 1
          fi
        env:
        - name: MIHOMO_CONFIG_DIR
          value: {{ .Values.config.dir | quote }}
        - name: MIHOMO_PROVIDER_PATH
          value: {{ .Values.provider.cachePath | quote }}
        volumeMounts:
        - name: config-template
          mountPath: /input/config.yaml.template
          subPath: config.yaml.template
          readOnly: true
        - name: subscription-url
          mountPath: /input/subscription-url
          subPath: subscription-url
          readOnly: true
        - name: runtime-config
          mountPath: {{ .Values.config.dir | quote }}
          {{- if .Values.persistence.subPath }}
          subPath: {{ .Values.persistence.subPath | quote }}
          {{- end }}
        {{- if .Values.controller.existingSecret }}
        - name: controller-secret
          mountPath: /input/controller-secret
          subPath: secret
          readOnly: true
        {{- end }}
      containers:
      - name: clash
        image: {{ include "common.images.image" (dict "imageRoot" .Values.image "global" .Values.global) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.command }}
        command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 8 }}
        {{- end }}
        {{- if .Values.args }}
        args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 8 }}
        {{- else }}
        args:
        - -d
        - {{ .Values.config.dir | quote }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.ports.http }}
          name: http
        - containerPort: {{ .Values.ports.controller }}
          name: controller
        volumeMounts:
        - name: runtime-config
          mountPath: {{ .Values.config.dir | quote }}
          {{- if .Values.persistence.subPath }}
          subPath: {{ .Values.persistence.subPath | quote }}
          {{- end }}
        {{- if .Values.console.enabled }}
        - name: console
          mountPath: {{ .Values.console.mountPath | quote }}
          readOnly: true
        {{- end }}
        {{- if .Values.extraVolumeMounts }}
          {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 8 }}
        {{- end }}
        env:
        - name: TZ
          value: {{ .Values.timezone | quote }}
        {{- if .Values.extraEnvVars }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 10 }}
        {{- end }}
        {{- if .Values.extraEnvVarsSecret }}
        envFrom:
        - secretRef:
            name: {{ .Values.extraEnvVarsSecret }}
        {{- end }}
        {{- if .Values.resources }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        {{- else if ne .Values.resourcesPreset "none" }}
        resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 10 }}
        {{- end }}
        {{- if .Values.customLivenessProbe }}
        livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 10 }}
        {{- else }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.ports.http }}
          initialDelaySeconds: 30
          periodSeconds: 10
        {{- end }}
        {{- if .Values.customReadinessProbe }}
        readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 10 }}
        {{- else }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.ports.http }}
          initialDelaySeconds: 10
          periodSeconds: 5
        {{- end }}
        {{- if .Values.customStartupProbe }}
        startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customStartupProbe "context" $) | nindent 10 }}
        {{- else }}
        startupProbe:
          tcpSocket:
            port: {{ .Values.ports.http }}
          initialDelaySeconds: 60
          periodSeconds: 15
        {{- end }}
      volumes:
      - name: config-template
        configMap:
          name: {{ include "clash.configTemplate.fullname" . }}
          defaultMode: 0444
      - name: subscription-url
        secret:
          secretName: {{ include "clash.subscription.secretName" . }}
          defaultMode: 0440
          items:
          - key: subscription-url
            path: subscription-url
      - name: runtime-config
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ default (include "common.names.fullname" .) .Values.persistence.existingClaim }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.console.enabled }}
      - name: console
        configMap:
          name: {{ include "clash.console.configMapName" . }}
          defaultMode: 0444
      {{- end }}
      {{- if .Values.controller.existingSecret }}
      - name: controller-secret
        secret:
          secretName: {{ .Values.controller.existingSecret | quote }}
          defaultMode: 0440
          items:
          - key: {{ .Values.controller.secretKey | quote }}
            path: secret
      {{- end }}
      {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 6 }}
      {{- end }}
