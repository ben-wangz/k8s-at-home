# Local storage with a chart-managed PVC and an inline repository list.
# Prerequisite: ssh.existingSecret with the private key. The known-hosts
# ConfigMap below is an optional seed for the default accept-new policy.
image:
  tag: 0.1.0

repositories:
  - name: team-main
    url: git@git.example.com:team/main.git
  - name: team-tools
    url: git@git.example.com:team/tools.git

ssh:
  enabled: true
  existingSecret: git-repo-backup-ssh
  privateKeyKey: ssh-privatekey
  knownHosts:
    existingConfigMap: git-repo-backup-known-hosts
    key: known_hosts

storage:
  type: local
  local:
    mountPath: /backup
    existingClaim: ""
    persistence:
      enabled: true
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 100Gi
