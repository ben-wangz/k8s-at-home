# Example external repositories ConfigMap referenced by
# repositoriesConfigMap.existingConfigMap. Create it out-of-band, e.g.:
#
#   kubectl create configmap git-repo-backup-repositories \
#     --from-file=repositories.yaml=examples/repositories.yaml
#
# The file content must use exactly this structure; names must be unique
# and match ^[A-Za-z0-9][A-Za-z0-9._-]*$.
repositories:
  - name: team-main
    url: git@git.example.com:team/main.git
  - name: team-tools
    url: ssh://git@git.example.com:2222/team/tools.git
