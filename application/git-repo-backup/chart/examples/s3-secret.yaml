# S3-compatible storage with static credentials from an existing Secret
# and a custom CA for a private endpoint.
image:
  tag: 0.1.0

repositories:
  - name: team-main
    url: git@git.example.com:team/main.git

ssh:
  existingSecret: git-repo-backup-ssh
  knownHosts:
    existingConfigMap: git-repo-backup-known-hosts

storage:
  type: s3
  s3:
    endpoint: https://s3.example.com
    region: us-east-1
    bucket: git-backups
    prefix: repositories
    forcePathStyle: true
    credentialsMode: secret
    existingSecret: git-repo-backup-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    sessionTokenKey: ""
    serverSideEncryption: AES256
    kmsKeyId: ""

customCA:
  existingConfigMap: git-repo-backup-ca
  key: ca.crt

# S3 staging and mirrors use the workspace volume; a claim avoids re-cloning
# large repositories into an emptyDir every night.
workspace:
  existingClaim: backup-workspace
