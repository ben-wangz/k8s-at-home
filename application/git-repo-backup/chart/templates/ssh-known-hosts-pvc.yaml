{{- if and .Values.ssh.enabled (eq (default "accept-new" .Values.ssh.hostKeyPolicy) "accept-new") (not .Values.ssh.knownHosts.existingClaim) .Values.ssh.knownHosts.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "git-repo-backup.persistentNamePrefix" . }}-ssh-known-hosts
  labels:
    {{- include "git-repo-backup.labels" . | nindent 4 }}
  annotations:
    # Host keys are trust state and must survive release recreation.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- with .Values.ssh.knownHosts.persistence.annotations }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.ssh.knownHosts.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.ssh.knownHosts.persistence.size | quote }}
  {{- include "common.storage.class" (dict "persistence" .Values.ssh.knownHosts.persistence "global" .Values.global) | nindent 2 }}
{{- end }}
