{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "git-repo-backup.cronjob.name" . }}
  labels:
    {{- include "git-repo-backup.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "git-repo-backup.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- with .Values.networkPolicy.egress }}
      {{- toYaml . | nindent 4 }}
    {{- else }}
    []
    {{- end }}
{{- end }}
