{{- if .Values.networkPolicy.enabled }}
apiVersion: {{ include "common.capabilities.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "git-repo-backup.cronjob.name" . }}
  labels:
    {{- include "git-repo-backup.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "git-repo-backup.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- with .Values.networkPolicy.egress }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- else }}
    []
    {{- end }}
{{- end }}
