{{- if and .Values.repositories (not .Values.repositoriesConfigMap.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "git-repo-backup.repositoriesConfigMapName" . }}
  labels:
    {{- include "git-repo-backup.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
data:
  repositories.yaml: |
    repositories:
      {{- range .Values.repositories }}
      - name: {{ .name | quote }}
        url: {{ .url | quote }}
      {{- end }}
{{- end }}
