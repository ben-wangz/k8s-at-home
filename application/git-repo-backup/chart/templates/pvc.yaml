{{- if and (eq .Values.storage.type "local") (not .Values.storage.local.existingClaim) .Values.storage.local.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "git-repo-backup.persistentNamePrefix" . }}-backup
  labels:
    {{- include "git-repo-backup.labels" . | nindent 4 }}
  annotations:
    # Uninstalling the release must never delete backup data.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- with .Values.storage.local.persistence.annotations }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.storage.local.persistence.accessModes | nindent 4 }}
  {{- with .Values.storage.local.persistence.size }}
  resources:
    requests:
      storage: {{ . | quote }}
  {{- end }}
  {{- include "common.storage.class" (dict "persistence" .Values.storage.local.persistence "global" .Values.global) | nindent 2 }}
{{- end }}
