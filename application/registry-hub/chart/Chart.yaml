apiVersion: v2
name: registry-hub
version: 0.1.10
appVersion: "0.2.5"
description: A local-first OCI Registry proxy with persistent artifact solidification
type: application
keywords:
  - registry
  - oci
  - mirror
dependencies:
  - name: common
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - bitnami-common
    version: 2.x.x
annotations:
  registry-hub/images: |
    - name: registry-hub-backend
      path: application/registry-hub/container
      valuesKey: backend.image.tag
home: https://github.com/ben-wangz/k8s-at-home
sources:
  - https://github.com/ben-wangz/k8s-at-home/tree/main/application/registry-hub
