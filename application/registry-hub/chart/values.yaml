nameOverride: ""
fullnameOverride: ""
global:
  imageRegistry: ""
  storageClass: ""
  defaultStorageClass: ""
commonLabels: {}
imagePullSecrets: []

backend:
  replicaCount: 1
  dnsPolicy: ""
  dnsConfig: {}
  image:
    registry: ghcr.io
    repository: ben-wangz/k8s-at-home-registry-hub-backend
    tag: 0.2.13
    digest: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  clientAuth:
    existingSecret: ""
    key: config.json
  adminAuth:
    existingSecret: ""
    key: config.json
  catalog:
    enabled: false
  distributionAuth:
    existingSecret: ""
    key: config.json
  limits:
    referrerPages: 100
  inventory:
    refreshSeconds: 30
    staleSeconds: 120
    snapshotRetentionSeconds: 3600
    batchSize: 100
    batchTimeoutSeconds: 60
  registryInspection:
    config:
      backend: disabled
      filesystemRoot: ""
      s3: {}
    credentialsSecret: ""
  solidification:
    idleTimeoutSeconds: 86400
    maxWaitingRoots: 1024
    maxBlobIntents: 10000
    maxProtectionSessions: 1024
    maxProtectedCacheBytes: 214748364800
    maxUnanchoredDistributionBytes: 1099511627776
  extraEnvVars: []
  extraEnvVarsSecret: ""
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 2Gi
  persistence:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi

registry:
  image:
    registry: docker.io
    repository: library/registry
    tag: 3.1.2
    digest: ""
    pullPolicy: IfNotPresent
  tls:
    enabled: true
    existingSecret: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
    caKey: ca.crt
  auth:
    htpasswdSecret: ""
    htpasswdKey: htpasswd
  httpSecret:
    existingSecret: ""
    key: http-secret
  redirect:
    enabled: false
    allowedEndpoints: []
  storage:
    type: filesystem
    filesystem:
      existingClaim: ""
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 100Gi
    s3:
      region: us-east-1
      bucket: ""
      rootDirectory: registry-hub
      endpoint: ""
      secure: true
      forcePathStyle: false
      chunkSize: 10485760
      credentialsSecret: ""
      caSecret: ""
      caKey: ca.crt
  extraEnvVars: []
  extraEnvVarsSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 4Gi

storage:
  backend: filesystem
  filesystemRoot: /var/lib/registry-hub
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: registry-hub
    forcePathStyle: false
    allowHTTP: false
    caSecret: ""
    caKey: ca.crt
    credentialsSecret: ""
    multipartThreshold: 67108864
    partSize: 16777216
    timeoutSeconds: 300
    maxConnections: 20
    replayMemoryBytes: 16777216
    replayMaxMemoryBytes: 67108864
    replayMaxDiskBytes: 214748364800
    replayDirectory: /var/run/registry-hub/s3-replay

gc:
  enabled: false
  uniqueWriterConfirmed: false
  serviceAccountName: ""

networkPolicy:
  enabled: true

service:
  client:
    port: 5000
    annotations: {}
  admin:
    port: 8081
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: registry-hub.example.invalid
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
nodeSelector: {}
tolerations: []
affinity: {}
extraDeploy: []
