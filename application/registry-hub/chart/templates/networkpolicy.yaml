{{- if .Values.networkPolicy.enabled }}
apiVersion: {{ include "common.capabilities.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ include "registry-hub.fullname" . }}-registry
  labels:
    {{- include "registry-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "registry-hub.registrySelector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "registry-hub.backendSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5000
{{- end }}
