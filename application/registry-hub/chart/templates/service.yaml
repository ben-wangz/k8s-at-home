apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-hub.fullname" . }}
  labels:
    {{- include "registry-hub.labels" . | nindent 4 }}
  {{- with .Values.service.client.annotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "registry-hub.backendSelector" . | nindent 4 }}
  ports:
    - name: registry
      port: {{ .Values.service.client.port }}
      targetPort: registry
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-hub.fullname" . }}-admin
  labels:
    {{- include "registry-hub.labels" . | nindent 4 }}
  {{- with .Values.service.admin.annotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "registry-hub.backendSelector" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-hub.fullname" . }}-registry
  labels:
    {{- include "registry-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "registry-hub.registrySelector" . | nindent 4 }}
  ports:
    - name: https-registry
      port: 5000
      targetPort: https-registry
      protocol: TCP
