{{- if .Values.gc.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "registry-hub.fullname" . }}-gc
  labels:
    {{- include "registry-hub.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "registry-hub.fullname" . }}-gc
  labels:
    {{- include "registry-hub.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ default (include "registry-hub.fullname" .) .Values.backend.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "registry-hub.fullname" . }}-gc
{{- end }}
